<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeCity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Faster+One&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header class="header">
        <span class="logo">BikeCity</span>

        <nav class="nav-bar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="/pages/aluguel-bicicletas.html">Alugue uma bicicleta</a></li>
                <li><a href="#">Pontos de aluguel</a></li>
                <li><a href="#">Planos</a></li>
                <li><a href="#">Sobre nós</a></li>
                <li><a href="#">Entre em contato</a></li>
            </ul>
        </nav>

        <div onclick="abrirModal()" class="login-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-user preview-icon">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            <span>Login</span>
        </div>
    </header>

    <div class="modal-overlay"
         id="modalLogin"
         aria-hidden="true"
         onclick="fecharAoClicarFora(event)">

        <section class="modal"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="tituloModal">

            <button type="button"
                    class="fechar-modal"
                    onclick="fecharModal()"
                    aria-label="Fechar modal">
                &times;
            </button>

            <div class="modal-cabecalho">
                <span class="logo logo-modal">BikeCity</span>

                <h2 id="tituloModal">Bem-vindo de volta!</h2>

                <p>Entre na sua conta para continuar.</p>
            </div>

            <form id="formLogin">

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="seuemail@exemplo.com"
                           autocomplete="email"
                           required>
                </div>


                <div class="campo">
                    <label for="senha">Senha</label>

                    <div class="senha-container">
                        <input type="password"
                               id="senha"
                               name="senha"
                               placeholder="Digite sua senha"
                               autocomplete="current-password"
                               required>

                        <button type="button"
                                class="mostrar-senha"
                                onclick="alternarSenha()"
                                aria-label="Mostrar senha">
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="opcoes-login">
                    <label class="lembrar-login">
                        <input type="checkbox" name="lembrar">
                        <span>Lembrar de mim</span>
                    </label>

                    <a href="#" class="link-destaque">
                        Esqueci minha senha
                    </a>
                </div>


                <button type="submit" class="botao-entrar">
                    Entrar
                </button>

            </form>

            <p class="texto-cadastro">
                Ainda não tem uma conta?
                <a href="/pages/cadastro.html" class="link-destaque">
                    Cadastre-se
                </a>
            </p>

            <p id="mensagemLogin" class="mensagem-login" aria-live="polite"></p>

        </section>
    </div>

</body>
<script src="/js/script.js"></script>
</html>
